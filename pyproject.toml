[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metarigor"
version = "0.1.0"
description = "Agent-ready evidence review services and CLI"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
]

[project.scripts]
metarigor = "metarigor.cli.main:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]


